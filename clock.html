<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Time Zones</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .clock-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            color: white;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            transition: all 0.3s ease;
            animation: slideIn 0.5s ease-out;
        }

        .clock-card:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-5px);
            box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.5);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .city-name {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .city-icon {
            font-size: 1.8rem;
        }

        .timezone-info {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 15px;
        }

        .time-display {
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 20px 0;
            font-family: 'Digital-7', 'Courier New', monospace;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .date-display {
            font-size: 1rem;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .period {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: 2px solid white;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .format-toggle {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .format-btn {
            padding: 10px 20px;
            border: 2px solid white;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .format-btn.active {
            background: white;
            color: #667eea;
        }

        .format-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.2);
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            opacity: 0.8;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .time-display {
                font-size: 2.2rem;
            }

            .clocks-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1><i class="fas fa-clock"></i> World Time Zone Clock</h1>
            <p>Real-time digital clock in multiple time zones</p>
        </div>

        <div class="format-toggle">
            <button class="format-btn active" onclick="setFormat('12h')">12-Hour Format</button>
            <button class="format-btn" onclick="setFormat('24h')">24-Hour Format</button>
        </div>

        <div class="clocks-grid" id="clocksGrid">
            <!-- Clocks will be inserted here by JavaScript -->
        </div>

        <div class="controls">
            <button class="btn" onclick="addClock()">
                <i class="fas fa-plus"></i> Add Time Zone
            </button>
            <button class="btn" onclick="resetClocks()">
                <i class="fas fa-redo"></i> Reset to Default
            </button>
            <button class="btn" onclick="toggleAutoUpdate()">
                <i class="fas fa-pause"></i> Pause Updates
            </button>
        </div>

        <div class="footer">
            <p>Updates automatically every second • All times are accurate to your device's system clock</p>
        </div>
    </div>

    <script>
        // Time zones configuration
        const defaultTimezones = [
            { name: 'New York', timezone: 'America/New_York', icon: '🗽', offset: -5 },
            { name: 'London', timezone: 'Europe/London', icon: '🇬🇧', offset: 0 },
            { name: 'Dubai', timezone: 'Asia/Dubai', icon: '🏙️', offset: 4 },
            { name: 'Tokyo', timezone: 'Asia/Tokyo', icon: '🗾', offset: 9 },
            { name: 'Sydney', timezone: 'Australia/Sydney', icon: '🦘', offset: 10 },
            { name: 'São Paulo', timezone: 'America/Sao_Paulo', icon: '🇧🇷', offset: -3 },
        ];

        let timezones = [...defaultTimezones];
        let timeFormat = '12h';
        let isUpdating = true;
        let clockInterval;

        // Available timezones for adding new ones
        const availableTimezones = [
            { name: 'Los Angeles', timezone: 'America/Los_Angeles', icon: '🌴' },
            { name: 'Chicago', timezone: 'America/Chicago', icon: '🏙️' },
            { name: 'Mexico City', timezone: 'America/Mexico_City', icon: '🌮' },
            { name: 'Paris', timezone: 'Europe/Paris', icon: '🗼' },
            { name: 'Berlin', timezone: 'Europe/Berlin', icon: '🍺' },
            { name: 'Moscow', timezone: 'Europe/Moscow', icon: '🇷🇺' },
            { name: 'Cairo', timezone: 'Africa/Cairo', icon: '🏛️' },
            { name: 'Bangkok', timezone: 'Asia/Bangkok', icon: '🏯' },
            { name: 'Hong Kong', timezone: 'Asia/Hong_Kong', icon: '🏙️' },
            { name: 'Singapore', timezone: 'Asia/Singapore', icon: '🦁' },
            { name: 'Mumbai', timezone: 'Asia/Kolkata', icon: '🇮🇳' },
            { name: 'Auckland', timezone: 'Pacific/Auckland', icon: '🥝' },
            { name: 'Honolulu', timezone: 'Pacific/Honolulu', icon: '🌺' },
            { name: 'Istanbul', timezone: 'Europe/Istanbul', icon: '🕌' },
            { name: 'Seoul', timezone: 'Asia/Seoul', icon: '🇰🇷' },
        ];

        function formatTime(date, format) {
            const hours = date.getHours();
            const minutes = date.getMinutes();
            const seconds = date.getSeconds();

            let displayHours, period;

            if (format === '12h') {
                period = hours >= 12 ? 'PM' : 'AM';
                displayHours = hours % 12 || 12;
            } else {
                displayHours = hours;
                period = '';
            }

            const paddedHours = String(displayHours).padStart(2, '0');
            const paddedMinutes = String(minutes).padStart(2, '0');
            const paddedSeconds = String(seconds).padStart(2, '0');

            return {
                time: `${paddedHours}:${paddedMinutes}:${paddedSeconds}`,
                period: period
            };
        }

        function getDateString(date) {
            const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
            return date.toLocaleDateString('en-US', options);
        }

        function getTimezoneOffset(timezone) {
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: timezone,
                hour12: false,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });

            const now = new Date();
            const utcDate = new Date(now.toLocaleString('en-US', { timeZone: 'UTC' }));
            const tzDate = new Date(now.toLocaleString('en-US', { timeZone: timezone }));

            const offset = (tzDate - utcDate) / (1000 * 60 * 60);
            return offset;
        }

        function updateClocks() {
            const grid = document.getElementById('clocksGrid');
            grid.innerHTML = '';

            timezones.forEach((tz, index) => {
                const now = new Date();
                const tzDate = new Date(now.toLocaleString('en-US', { timeZone: tz.timezone }));
                const { time, period } = formatTime(tzDate, timeFormat);
                const date = getDateString(tzDate);
                const offset = getTimezoneOffset(tz.timezone).toFixed(1);

                const clockCard = document.createElement('div');
                clockCard.className = 'clock-card';
                clockCard.innerHTML = `
                    <div class="city-name">
                        <span class="city-icon">${tz.icon}</span>
                        <span>${tz.name}</span>
                    </div>
                    <div class="timezone-info">UTC ${offset >= 0 ? '+' : ''}${offset}</div>
                    <div class="date-display">${date}</div>
                    <div class="time-display">${time}</div>
                    ${period ? `<div class="period">${period}</div>` : ''}
                    <button class="btn" style="width: 100%; margin-top: 15px; justify-content: center;" onclick="removeClock(${index})">
                        <i class="fas fa-trash"></i> Remove
                    </button>
                `;
                grid.appendChild(clockCard);
            });
        }

        function setFormat(format) {
            timeFormat = format;
            document.querySelectorAll('.format-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            updateClocks();
        }

        function removeClock(index) {
            if (timezones.length > 1) {
                timezones.splice(index, 1);
                updateClocks();
            } else {
                alert('You must have at least one time zone!');
            }
        }

        function addClock() {
            const unusedTimezones = availableTimezones.filter(
                tz => !timezones.some(existing => existing.timezone === tz.timezone)
            );

            if (unusedTimezones.length === 0) {
                alert('All available time zones are already displayed!');
                return;
            }

            const selectedIndex = Math.floor(Math.random() * unusedTimezones.length);
            timezones.push(unusedTimezones[selectedIndex]);
            updateClocks();
        }

        function resetClocks() {
            timezones = [...defaultTimezones];
            updateClocks();
        }

        function toggleAutoUpdate() {
            isUpdating = !isUpdating;
            const btn = event.target.closest('.btn');
            if (isUpdating) {
                btn.innerHTML = '<i class="fas fa-pause"></i> Pause Updates';
                clockInterval = setInterval(updateClocks, 1000);
            } else {
                btn.innerHTML = '<i class="fas fa-play"></i> Resume Updates';
                clearInterval(clockInterval);
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            updateClocks();
            clockInterval = setInterval(updateClocks, 1000);
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            clearInterval(clockInterval);
        });
    </script>

</body>
</html>
